<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMT Demo – Technician Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--muted:#475569;--line:#E2E8F0;--bg:#F6F7F9;--card:#fff;--pri:#1D4ED8;--pri-d:#1E3A8A;--nav:#0F172A;--nav2:#1E293B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',Tahoma,system-ui,sans-serif}
a{color:var(--pri)}a:hover{color:var(--pri-d)}
button{font:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 236px;background:var(--nav);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;color:#fff}
.logo{width:36px;height:36px;border-radius:9px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#CBD5E1;text-decoration:none;font-size:14px}
.side a:hover{background:var(--nav2);color:#fff}
.side a.on{background:var(--nav2);color:#fff;font-weight:600}
.badge{margin-left:auto;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.b-amb{background:#F59E0B;color:#111827}.b-red{background:#EF4444;color:#fff}
.side .out{margin-top:24px;border-top:1px solid var(--nav2);border-radius:0;padding-top:16px}
main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:26px;font-weight:700}
h2{margin:0;font-size:17px;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:14px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head>div:first-child{display:flex;flex-direction:column;gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-size:26px;font-weight:700}.kpi .s{font-size:13px;color:var(--muted)}
.kpi.bad{background:#FFF7F7;border-color:#FECACA}.kpi.bad .l,.kpi.bad .v{color:#991B1B}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.grow3{flex:3 1 560px;min-width:0}.grow2{flex:2 1 360px;min-width:0}
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EEF2F6;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sel{background:#EFF6FF;box-shadow:inset 3px 0 0 var(--pri)}
tr.err{background:#FEF2F2}
tfoot td{font-weight:700;background:#F8FAFC}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-wait{background:#FEF3C7;color:#92400E}.p-ok{background:#DCFCE7;color:#166534}.p-sent{background:#DBEAFE;color:#1E40AF}.p-fail{background:#FEE2E2;color:#991B1B}.p-hold{background:#EDE9FE;color:#5B21B6}.p-grey{background:#F1F5F9;color:#334155}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #CBD5E1;background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn-p:hover{background:var(--pri-d);color:#fff}
.btn-o{background:#fff;color:var(--ink);border-color:#94A3B8}
.btn-d{background:#fff;color:#991B1B;border-color:#FCA5A5}
.btn[disabled]{background:#CBD5E1;border-color:#CBD5E1;color:#334155;cursor:not-allowed}
.btn-sm{border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px;background:#fff;border:1px solid #94A3B8;color:var(--ink)}
.btn-sm.red{color:#991B1B;border-color:#FCA5A5}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--pri);cursor:pointer;text-decoration:underline;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
.linkbtn.name{font-family:inherit;font-size:14px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;color:var(--ink);border:1px solid #94A3B8;border-radius:10px;padding:10px 12px;background:#fff}
.split{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.split>div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px}
.split>div+div{border-top:1px solid var(--line)}
.split .tot{background:#F8FAFC;font-weight:700}
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.tl li{display:flex;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.d-ok{background:#16A34A}.d-wait{background:#F59E0B}.d-grey{background:#CBD5E1}
.q{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);background:#F8FAFC;border-radius:0 0 12px 12px}
pre.code{margin:0;background:#0F172A;color:#E2E8F0;border-radius:10px;padding:14px;font-size:12.5px;line-height:1.6;overflow-x:auto}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:end;height:190px;border-bottom:1px solid #CBD5E1;padding:0 4px}
.chart>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:#334155}
.chart i{display:block;width:100%;max-width:56px;border-radius:6px 6px 0 0;background:#93C5FD}
.chart i.first{background:var(--pri)}
.axis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast div{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(15,23,42,.25);max-width:360px}
.crumb{font-size:14px;color:var(--muted)}
.check li{display:flex;gap:10px;font-size:14px}
.ok{color:#166534;font-weight:700}.no{color:#991B1B;font-weight:700}.warn{color:#92400E;font-weight:700}
.tabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;font-size:15px;padding:12px 2px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;min-height:44px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--pri)}
.demo{background:#FEF3C7;color:#78350F;font-size:13px;padding:8px 32px;text-align:center}
/* login */
.login{display:flex;flex-wrap:wrap;min-height:100vh;background:#fff}
.login>section{flex:1 1 420px;padding:56px;display:flex}
.login .hero{background:var(--nav);color:#fff;flex-direction:column;justify-content:space-between;gap:40px}
.login .form{align-items:center;justify-content:center}
/* phone */
.phone{width:390px;max-width:100%;height:800px;border-radius:36px;border:10px solid #0F172A;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);margin:0 auto;box-shadow:0 20px 50px rgba(15,23,42,.18)}
.seg{display:flex;gap:4px;margin:14px 16px 6px;background:#E2E8F0;border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:none;font-size:14px;padding:10px 0;border-radius:8px;cursor:pointer;color:#334155}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.12)}
@media (max-width:720px){main{padding:20px 16px 40px}.side{flex-basis:100%;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px}.brand{padding:0 8px 0 0}.brand .t{display:none}.side a{white-space:nowrap}.side .out{margin:0;border:0;padding:10px 12px}.login>section{padding:28px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
// ---------- Config & data (ข้อมูลตัวอย่าง) ----------
const CFG = { p1: 90, p2: 10, deposit: 10000 };
const TODAY = new Date(2026, 10, 10); // 10/11/2026
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const split = t => { const a = Math.round(t * CFG.p1) / 100; return [a, Math.round((t - a) * 100) / 100]; };
const pd = s => { const [d, m, y] = s.split('/').map(Number); return new Date(y, m - 1, d); };
const daysTo = s => Math.round((pd(s) - TODAY) / 864e5);
const now = () => { const d = new Date(); return '10/11/2026 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0') + ' น.'; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const techs = [
  { id: 'TC-0102', name: 'สมชาย ใจดี', st: 'ACTIVE', dep: 10000, app: '14/03/2026', bank: 'กสิกรไทย ••• 4821', sup: 'SUP-10231' },
  { id: 'TC-0219', name: 'อนุชา รักงาน', st: 'ACTIVE', dep: 10000, app: '02/06/2026', bank: 'ไทยพาณิชย์ ••• 7702', sup: 'SUP-10307' },
  { id: 'TC-0457', name: 'ธนพล ขยันยิ่ง', st: 'VERIFY', dep: 10000, app: '08/11/2026', bank: 'กรุงเทพ ••• 3304', sup: 'รอสร้าง' },
  { id: 'TC-0461', name: 'กิตติ พร้อมทำ', st: 'PENDING', dep: 0, app: '09/11/2026', bank: 'กรุงไทย ••• 5512', sup: 'รอสร้าง' },
  { id: 'TC-0088', name: 'ประเสริฐ มั่นคง', st: 'ACTIVE', dep: 10000, app: '21/01/2026', bank: 'กสิกรไทย ••• 0921', sup: 'SUP-10094' },
  { id: 'TC-0145', name: 'มานพ เลิกงาน', st: 'OFFBOARD', dep: 10000, app: '11/04/2026', bank: 'ออมสิน ••• 6610', sup: 'SUP-10166' },
  { id: 'TC-0312', name: 'สุรชัย ทำจริง', st: 'ACTIVE', dep: 10000, app: '18/07/2026', bank: 'กรุงศรี ••• 2290', sup: 'SUP-10412' },
  { id: 'TC-0188', name: 'วิชัย ช่างดี', st: 'ACTIVE', dep: 10000, app: '05/05/2026', bank: 'ทหารไทยธนชาต ••• 8145', sup: 'SUP-10188' }
];
const TST = { ACTIVE: ['ACTIVE', 'p-ok'], VERIFY: ['รอ Finance ยืนยัน', 'p-sent'], PENDING: ['รอวางเงิน', 'p-wait'], OFFBOARD: ['รอคืนเงิน', 'p-grey'] };

// s1 = งวดแรก 90% · s2 = เงิน hold 10%
const jobs = [
  ['BK-2611-00418', 'TC-0102', 'R · ห้องครัว / 2.3 ระบบไฟ', 2000, '10/11/2026', '10/02/2027', 'WAIT', 'RETAINED'],
  ['BK-2611-00402', 'TC-0219', 'Q · ติดตั้งเครื่องทำน้ำอุ่น', 1200, '10/11/2026', '10/12/2026', 'WAIT', 'RETAINED'],
  ['BK-2611-00399', 'TC-0188', 'Q · ซ่อมก๊อกน้ำ', 800, '10/11/2026', '10/12/2026', 'WAIT', 'RETAINED'],
  ['BK-2611-00391', 'TC-0088', 'R · ห้องรับแขก / 1.2 ปูกระเบื้อง', 8500, '09/11/2026', '09/02/2027', 'WAIT', 'RETAINED'],
  ['BK-2611-00388', 'TC-0312', 'R · ห้องครัว / 2.2 ปูพื้นยาง', 4600, '09/11/2026', '09/02/2027', 'WAIT', 'RETAINED'],
  ['BK-2611-00384', 'TC-0219', 'Q · ติดตั้งเครื่องทำน้ำอุ่น', 1200, '09/11/2026', '09/12/2026', 'FAIL', 'RETAINED'],
  ['BK-2611-00379', 'TC-0312', 'R · ห้องน้ำ / 3.2 ระบบน้ำ', 3400, '09/11/2026', '09/02/2027', 'FAIL', 'RETAINED'],
  ['BK-2611-00360', 'TC-0102', 'R · ห้องรับแขก / 1.2 ปูกระเบื้อง', 4600, '06/11/2026', '06/02/2027', 'PAID', 'RETAINED'],
  ['BK-2608-00122', 'TC-0088', 'R · ห้องรับแขก / 1.2 ปูกระเบื้อง', 8500, '08/08/2026', '08/11/2026', 'PAID', 'DUE'],
  ['BK-2608-00117', 'TC-0188', 'Q · เปลี่ยนสวิตช์ไฟ', 600, '07/08/2026', '07/11/2026', 'PAID', 'DUE'],
  ['BK-2609-00211', 'TC-0102', 'R · ห้องน้ำ / 1.1 รื้อถอน', 3000, '11/08/2026', '11/11/2026', 'PAID', 'HOLD'],
  ['BK-2608-00140', 'TC-0312', 'Q · ติดตั้งพัดลมเพดาน', 1100, '14/08/2026', '14/11/2026', 'PAID', 'RETAINED'],
  ['BK-2608-00152', 'TC-0219', 'R · ห้องครัว / 2.3 ระบบไฟ', 4900, '20/08/2026', '20/11/2026', 'PAID', 'RETAINED'],
  ['BK-2609-00163', 'TC-0088', 'R · ห้องนอน / 4.1 ทาสี', 6800, '02/09/2026', '02/12/2026', 'PAID', 'RETAINED'],
  ['BK-2609-00188', 'TC-0145', 'R · ห้องน้ำ / 3.1 ปูกระเบื้อง', 4500, '05/09/2026', '05/12/2026', 'PAID', 'RETAINED'],
  ['BK-2605-00314', 'TC-0145', 'R · ห้องครัว / 2.1 รื้อถอน', 5400, '28/05/2026', '28/08/2026', 'PAID', 'PAID']
].map(([id, tech, job, total, closed, wend, s1, s2]) => ({ id, tech, job, total, closed, wend, s1, s2, tries: s1 === 'FAIL' ? 3 : 0 }));
const S1 = { WAIT: ['รออนุมัติ', 'p-wait'], SENT: ['ส่ง Oracle แล้ว', 'p-sent'], PAID: ['จ่ายแล้ว', 'p-ok'], FAIL: ['SYNC_FAILED', 'p-fail'] };
const S2 = { RETAINED: ['HOLD 10% · อยู่ในประกัน', 'p-grey'], HOLD: ['ระงับ · มีเคลม', 'p-hold'], DUE: ['พ้นประกัน · DUE', 'p-sent'], SENT: ['ส่ง Oracle แล้ว', 'p-sent'], PAID: ['จ่ายแล้ว', 'p-ok'] };

const events = [
  { t: '17:24 น.', id: 'BK-2611-00431', task: '2.3 ระบบไฟ', tech: 'TC-0461', total: 3200, qc: ['ผ่าน · 5', 'p-ok'], by: 'นภา ใส่ใจ', res: ['ปฏิเสธ · ช่างยังไม่ ACTIVE', 'p-fail'], why: 'ช่าง TC-0461 สถานะรอวางเงินค้ำประกัน' },
  { t: '17:11 น.', id: 'BK-2611-00429', task: 'Q · ติดตั้งก๊อก', tech: 'TC-0188', total: 900, qc: ['ผ่าน · 1 (rework)', 'p-ok'], by: 'สุดา ดูแล', res: ['สร้างรายการจ่ายแล้ว', 'p-ok'] },
  { t: '16:58 น.', id: 'BK-2611-00418', task: '2.3 ระบบไฟ', tech: 'TC-0102', total: 2000, qc: ['ผ่าน · 5', 'p-ok'], by: 'นภา ใส่ใจ', res: ['ส่งซ้ำ · อัปเดตแล้ว', 'p-grey'] },
  { t: '16:40 น.', id: 'BK-2611-00425', task: '1.2 ปูกระเบื้อง', tech: 'TC-0088', total: 5400, qc: ['ESCALATED', 'p-wait'], by: 'สุดา ดูแล', res: ['ปฏิเสธ · QC ยังไม่ผ่าน', 'p-fail'], why: 'Task อยู่ในสถานะ ESCALATED (rework ครบ 5 รอบ)' },
  { t: '16:22 น.', id: 'BK-2611-00422', task: 'Q · ซ่อมปั๊มน้ำ', tech: 'TC-0219', total: 1500, qc: ['ผ่าน · 5', 'p-ok'], by: 'นภา ใส่ใจ', res: ['สร้างรายการจ่ายแล้ว', 'p-ok'] },
  { t: '15:57 น.', id: 'BK-2611-00420', task: '3.1 รื้อถอน', tech: 'TC-0312', total: 2800, qc: ['ผ่าน · 5', 'p-ok'], by: 'สุดา ดูแล', res: ['สร้างรายการจ่ายแล้ว', 'p-ok'] }
];

const audit = [
  ['10/11/2026 10:02:15 น.', ['ระบบ', 'p-grey'], 'คำนวณงวด 90/10', 'BK-2611-00418', 'ค่างาน 2,000.00 → จ่ายทันที 1,800.00 · hold 200.00 · พ้นประกัน 10/02/2027'],
  ['10/11/2026 10:02:14 น.', ['CRM API', 'p-hold'], 'รับ Close Job', 'BK-2611-00418 · Task 2.3', '– → CALCULATED · ยืนยันโดย napa.s'],
  ['10/11/2026 10:21:14 น.', ['Oracle API', 'p-hold'], 'ส่ง Payment Request', 'BK-2611-00384 · งวด 1', 'ครั้งที่ 3/3 · HTTP 503 → SYNC_FAILED'],
  ['09/11/2026 16:02:51 น.', ['วรรณา (Finance)', 'p-sent'], 'แก้ไขข้อมูลช่าง', 'TC-0102', 'บัญชีธนาคาร ••• 1190 → ••• 4821'],
  ['08/11/2026 06:00:02 น.', ['ระบบ', 'p-grey'], 'Scheduler เงิน hold', 'BK-2608-00122 · งวด 2', 'RETAINED → DUE']
];
const log = (who, act, ref, chg) => audit.unshift([now(), who, act, ref, chg]);

// ---------- State ----------
const st = { tab: 'p1', sel: 'BK-2611-00418', checked: { 'BK-2611-00418': true, 'BK-2611-00402': true }, techFilter: 'ALL', techSel: 'TC-0457', retFilter: 'SOON', evSel: 'BK-2611-00431', oraFilter: 'FAIL', stmtTab: 'ALL', auditQ: '', rep: 'tech' };
const T = id => techs.find(t => t.id === id);
const J = id => jobs.find(j => j.id === id);
const pill = ([l, c]) => `<span class="pill ${c}">${esc(l)}</span>`;
function toast(msg) { const el = document.createElement('div'); el.textContent = msg; document.getElementById('toast').appendChild(el); setTimeout(() => el.remove(), 3200); }

// ---------- Layout ----------
const NAV = [['dashboard', 'Dashboard'], ['closejobs', 'รับ Close Job'], ['approvals', 'คิวอนุมัติจ่าย', 'amb'], ['technicians', 'บัญชีช่าง & เงินค้ำประกัน'], ['retention', 'เงิน hold 10% รอปล่อย'], ['oracle', 'ส่ง Oracle', 'red'], ['reports', 'รายงาน'], ['audit', 'Audit log'], ['settings', 'ตั้งค่า'], ['statement', 'Statement ช่าง (มือถือ)']];
function shell(route, body) {
  const cnt = { approvals: jobs.filter(j => j.s1 === 'WAIT').length + jobs.filter(j => j.s2 === 'DUE').length, oracle: jobs.filter(j => j.s1 === 'FAIL').length };
  const active = route === 'techdetail' ? 'technicians' : route;

  ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="mono">${r[2]}</td><td class="num">${r[3] ? fmt(r[3]) : '–'}</td><td class="num">${r[4] ? fmt(r[4]) : '–'}</td><td>${pill(r[5])}</td></tr>`).join('')}

    <div class="split"><div><span>เงินค้ำประกัน</span><span>${fmt(t.dep)}</span></div><div><span>หักภาระคงค้าง</span><span>0.00</span></div><div class="tot"><span>ยอดคืน</span><span>฿${fmt(t.dep)}</span></div></div>

V.retention = () => {

  const sum = s => all.filter(j => j.s2 === s).reduce((t, j) => t + split(j.total)[1], 0);

  <section class="tblwrap"><table><thead><tr><th>Booking No.</th><th>ช่าง</th><th>งาน</th><th>ปิดงาน</th><th>พ้นประกัน</th><th class="num">เงิน hold ${CFG.p2}%</th><th>สถานะ</th><th></th></tr></thead><tbody>

    return `<tr><td class="mono">${j.id}</td><td>${T(j.tech).name}</td><td>${j.job}</td><td>${j.closed}</td><td>${j.wend}</td><td class="num">${fmt(split(j.total)[1])}</td><td>${pill(s)}</td><td>${j.s2 === 'DUE' ? `<a href="#/approvals" data-act="gop2">อนุมัติ</a>` : j.s2 === 'HOLD' ? `<button class="btn-sm" data-act="closeclaim" data-id="${j.id}">ปิดเคลม (demo)</button>` : '<span class="q">–</span>'}</td></tr>`; }).join('') : '<tr><td colspan="8" class="q" style="text-align:center;padding:28px">ไม่มีรายการ</td></tr>'}
  </tbody></table></section>`;

V.oracle = () => {
  const f = st.oraFilter;

  </tbody></table></section>
  ${fj ? `<section class="card"><h2>Log การเรียก API · ${fj.id}</h2><div class="row"><div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px">
    <div style="display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px"><span>ครั้งที่ 1 · 10:05:12 น.</span><span class="no">504 Timeout</span></div>
    <div style="display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px"><span>ครั้งที่ 2 · 10:06:13 น.</span><span class="no">504 Timeout</span></div>
    <div style="display:flex;justify-content:space-between;padding:10px 12px;border:1px solid #FCA5A5;background:#FEF2F2;border-radius:8px"><span>ครั้งที่ 3 · 10:21:14 น.</span><span class="no">503 Unavailable</span></div>
    <span class="q" style="font-size:13px">Idempotency key: <span class="mono">BMT-${fj.id}-P1</span> — ส่งซ้ำไม่สร้างรายการซ้ำใน Oracle</span></div>
    <pre class="code mono" style="flex:1 1 360px;min-width:0">POST /ap/payment-requests
{
  "supplier_id": "${T(fj.tech).sup}",

← 503 {"error":"service unavailable"}</pre></div></section>` : ''}`;

      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="q" style="font-size:13px;margin-bottom:8px">วิธีรับเงิน (รอยืนยัน)</legend>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px"><input type="radio" name="dep" checked><span><b>โอนก้อนเดียวก่อนรับงาน</b><br><span class="q">ช่างเป็น ACTIVE เมื่อ Finance ยืนยันรับเงินครบ</span></span></label>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px"><input type="radio" name="dep"><span><b>ทยอยหักจากค่างานจนครบ</b><br><span class="q">ช่างรับงานได้ทันที ระบบหักจากงวดแรกตามอัตราที่กำหนด</span></span></label></fieldset></section>
    <section class="card"><h2>วงเงินอนุมัติและรอบจ่าย</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"><label class="field">Approver อนุมัติได้ไม่เกิน (บาท/ชุด)<input type="text" placeholder="[รอยืนยัน]"></label><label class="field">เกินวงเงิน ส่งต่อให้<select><option>Finance Manager</option></select></label><label class="field">รอบส่ง Oracle<select><option>ทันทีที่อนุมัติ</option><option>ทุกวัน 16:00 น.</option><option>รายสัปดาห์</option></select></label></div></section>
  </div><div class="grow2" style="display:flex;flex-direction:column;gap:16px">
    <section class="card"><h2>การเชื่อมต่อระบบ</h2>${[['CRM', 'webhook Close Job', 1], ['INT', 'ช่าง Approved / สถานะ', 1], ['Oracle', 'Payment Request', !jobs.some(j => j.s1 === 'FAIL')], ['LON', 'Line OA', 1]].map(([n, d, ok]) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px"><span><b>${n}</b> · ${d}</span><span style="display:flex;gap:8px;align-items:center">${pill(ok ? ['ปกติ', 'p-ok'] : ['มี error', 'p-fail'])}<button class="btn-sm" data-act="test" data-id="${n}">ทดสอบ</button></span></div>`).join('')}</section>
    <section class="card"><h2>ผู้ใช้และสิทธิ์</h2>${[['วรรณา', 'Finance / Payment Officer'], ['สมพร', 'Approver'], ['ธีระ', 'Finance Manager'], ['กฤษณ์', 'Admin'], ['ผู้บริหาร (3)', 'ดูอย่างเดียว']].map(([a, b]) => `<div style="display:flex;justify-content:space-between;font-size:14px"><span>${a}</span><span class="q">${b}</span></div>`).join('')}<p class="sub" style="font-size:13px">ผู้สร้างรายการอนุมัติรายการของตัวเองไม่ได้ (Segregation of Duties)</p></section>
  </div></div>`;

V.statement = () => {
  const me = T('TC-0102'), my = jobs.filter(j => j.tech === me.id);
  const f = st.stmtTab;
  const list = my.filter(j => f === 'ALL' || (f === 'PAID' ? j.s1 === 'PAID' : ['RETAINED', 'HOLD', 'DUE'].includes(j.s2)));
  const got = my.filter(j => j.s1 === 'PAID').reduce((s, j) => s + split(j.total)[0], 0) + my.filter(j => j.s2 === 'PAID').reduce((s, j) => s + split(j.total)[1], 0);
  const held = my.filter(j => ['RETAINED', 'HOLD', 'DUE'].includes(j.s2)).reduce((s, j) => s + split(j.total)[1], 0);
  return `<div class="head"><div><h1>Statement ช่าง (มือถือ)</h1><p class="sub">มุมมองของช่าง ${me.name} — เปิดจากลิงก์ใน Line OA</p></div></div>
  <div class="phone"><header style="background:var(--nav);color:#fff;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:13px;color:#CBD5E1">สวัสดี</span><div style="font-size:18px;font-weight:700">${me.name}</div></div>${pill(TST[me.st])}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style="background:var(--nav2);border-radius:12px;padding:12px"><span style="font-size:12px;color:#CBD5E1">ได้รับแล้ว</span><div style="font-size:20px;font-weight:700">฿${fmt(got)}</div></div><div style="background:var(--nav2);border-radius:12px;padding:12px"><span style="font-size:12px;color:#CBD5E1">เงิน hold ${CFG.p2}% รอปล่อย</span><div style="font-size:20px;font-weight:700">฿${fmt(held)}</div></div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#CBD5E1"><span>เงินค้ำประกัน ฿${fmt(me.dep)}</span><span>ครบแล้ว ✓</span></div></header>
    <div class="seg" role="tablist">${[['ALL', 'ทั้งหมด'], ['PAID', 'จ่ายแล้ว'], ['HELD', 'รอปล่อย']].map(([k, l]) => `<button role="tab" aria-selected="${f === k}" class="${f === k ? 'on' : ''}" data-act="sf" data-id="${k}">${l}</button>`).join('')}</div>
    <ul style="list-style:none;margin:0;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1">
    ${list.map(j => { const [a, b] = split(j.total); return `<li style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600;font-size:15px">${j.job.split(' · ')[1]}</span>${pill(j.s1 === 'PAID' ? ['จ่ายแล้ว', 'p-ok'] : j.s1 === 'WAIT' ? ['รออนุมัติ', 'p-wait'] : S1[j.s1])}</div>
      <span class="mono q" style="font-size:12px">${j.id} · ปิดงาน ${j.closed}</span>
      <div style="display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px dashed #CBD5E1;padding-top:8px">
        <div style="display:flex;justify-content:space-between"><span class="q">ค่างาน</span><span>${fmt(j.total)}</span></div>
        <div style="display:flex;justify-content:space-between"><span class="q">จ่ายทันที ${CFG.p1}%</span><b>${fmt(a)}</b></div>
        <div style="display:flex;justify-content:space-between"><span class="q">hold ${CFG.p2}% · ${j.s2 === 'PAID' ? 'ปล่อยแล้ว' : 'ปล่อย ' + j.wend}</span><span>${fmt(b)}</span></div></div>
      ${j.s2 === 'HOLD' ? '<span style="font-size:13px;color:#5B21B6">ระงับไว้จนกว่าเคลม CL-0093 จะปิด</span>' : ''}</li>`; }).join('')}
    </ul></div>`;
};

// ---------- Router & actions ----------
function render() {
  const [, route = 'login', arg] = location.hash.split('/');
  const r = V[route] ? route : 'login';
  document.getElementById('app').innerHTML = r === 'login' ? V.login() : shell(r, V[r](arg));
  document.title = 'BMT Demo · ' + (NAV.find(n => n[0] === r) || ['', 'เข้าสู่ระบบ'])[1];
  const aq = document.getElementById('aq'); if (aq) { aq.oninput = e => { st.auditQ = e.target.value; render(); const n = document.getElementById('aq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }; }
  const rates = document.querySelectorAll('.rate'); rates.forEach(i => i.onchange = e => { const v = Math.max(0, Math.min(100, Number(e.target.value) || 0)); st.pendingRate = v; rates.forEach(x => x.value = v); });
}
function sendOracle(j, inst) {
  const key = inst === 1 ? 's1' : 's2'; j[key] = 'SENT';
  log(['ระบบ', 'p-grey'], 'ส่ง Payment Request', j.id + (inst === 1 ? ' · งวดแรก' : ' · ปล่อย hold'), 'APPROVED → SENT_TO_ORACLE · HTTP 201');
  setTimeout(() => { j[key] = 'PAID'; log(['Oracle API', 'p-hold'], 'รับผลอนุมัติจ่าย', j.id, 'SENT_TO_ORACLE → PAID'); toast('Oracle อนุมัติจ่าย ' + j.id + ' แล้ว'); render(); }, 1800);
}
function approve(ids) {
  const inst = st.tab === 'p1' ? 1 : 2;
  ids.forEach(id => { const j = J(id); const amt = split(j.total)[inst - 1]; log(['สมพร (Approver)', 'p-sent'], inst === 1 ? 'อนุมัติงวดแรก' : 'อนุมัติปล่อยเงิน hold', j.id, `WAIT_APPROVAL → APPROVED · ฿${fmt(amt)}`); sendOracle(j, inst); delete st.checked[id]; });
  toast(`อนุมัติ ${ids.length} รายการ · ส่ง Oracle แล้ว`); render();
}
function reject(ids) {
  const note = (document.getElementById('note') || {}).value || '';
  if (!note.trim()) { toast('กรุณาระบุเหตุผลในหมายเหตุก่อนปฏิเสธ'); const n = document.getElementById('note'); if (n) n.focus(); return; }
  ids.forEach(id => { const j = J(id); log(['สมพร (Approver)', 'p-sent'], 'ปฏิเสธรายการจ่าย', j.id, 'WAIT_APPROVAL → REJECTED · ' + note); if (st.tab === 'p1') j.s1 = 'REJ'; else j.s2 = 'RETAINED'; delete st.checked[id]; });
  S1.REJ = ['ปฏิเสธ', 'p-fail']; toast(`ปฏิเสธ ${ids.length} รายการ`); render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const shown = () => jobs.filter(j => st.tab === 'p1' ? j.s1 === 'WAIT' : j.s2 === 'DUE');
  switch (a) {
    case 'tab': st.tab = id; st.sel = (shown()[0] || {}).id; break;
    case 'sel': st.sel = id; break;
    case 'chk': st.checked[id] = el.checked; break;
    case 'all': shown().forEach(j => st.checked[j.id] = el.checked); break;
    case 'approve': approve(shown().filter(j => st.checked[j.id]).map(j => j.id)); return;
    case 'approve1': approve([id]); return;
    case 'reject': reject(shown().filter(j => st.checked[j.id]).map(j => j.id)); return;
    case 'reject1': reject([id]); return;
    case 'gop2': st.tab = 'p2'; st.sel = (jobs.find(j => j.s2 === 'DUE') || {}).id; return;
    case 'resend': { const j = J(id); log(['วรรณา (Finance)', 'p-sent'], 'ส่งซ้ำ Oracle', j.id, 'SYNC_FAILED → RETRY'); sendOracle(j, 1); toast('ส่งซ้ำ ' + j.id + ' แล้ว'); break; }
    case 'of': st.oraFilter = id; break;
    case 'tf': st.techFilter = id; break;
    case 'tsel': st.techSel = id; break;
    case 'verify': { const t = T(id); t.st = 'ACTIVE'; t.sup = 'SUP-10' + id.slice(3); log(['วรรณา (Finance)', 'p-sent'], 'ยืนยันรับเงินค้ำประกัน', t.id, `VERIFY → ACTIVE · ฿${fmt(t.dep)} · แจ้ง INT แล้ว`); toast(t.name + ' เป็น ACTIVE แล้ว · แจ้ง INT แล้ว'); break; }
    case 'remind': log(['ระบบ', 'p-grey'], 'แจ้งเตือนวางเงินค้ำประกัน', id, 'ส่ง Line OA'); toast('ส่งแจ้งเตือนผ่าน Line OA แล้ว'); return;
    case 'askdoc': toast('ส่งคำขอเอกสารเพิ่มให้ช่างแล้ว'); return;
    case 'refund': toast('สร้างรายการคืนเงินค้ำประกันแล้ว · รออนุมัติ'); return;
    case 'rf': st.retFilter = id; break;
    case 'closeclaim': { const j = J(id); j.s2 = daysTo(j.wend) <= 0 ? 'DUE' : 'RETAINED'; log(['CRM API', 'p-hold'], 'ปิดเคลม CL-0093', j.id, 'HOLD → ' + j.s2); toast('ปิดเคลมแล้ว · ' + j.id + ' เป็น ' + j.s2); break; }
    case 'ev': st.evSel = id; break;
    case 'recheck': { const ev = events.find(x => x.id === id); if (T(ev.tech).st === 'ACTIVE' && ev.qc[1] === 'p-ok') { ev.res = ['สร้างรายการจ่ายแล้ว', 'p-ok']; jobs.unshift({ id: ev.id, tech: ev.tech, job: 'R · ' + ev.task, total: ev.total, closed: '10/11/2026', wend: '10/02/2027', s1: 'WAIT', s2: 'RETAINED', tries: 0 }); log(['ระบบ', 'p-grey'], 'สร้างรายการจ่ายจาก event เดิม', ev.id, `– → WAIT_APPROVAL · ฿${fmt(split(ev.total)[0])}`); toast('สร้างรายการจ่ายแล้ว · ไปที่คิวอนุมัติ'); } else toast('ยังไม่ผ่านเงื่อนไข: ' + ev.why); break; }
    case 'refresh': toast('ดึงข้อมูลจาก CRM แล้ว · ไม่มี event ใหม่'); return;
    case 'recon': toast('กระทบยอดแล้ว · ยอด BMT ตรงกับ Oracle'); return;
    case 'test': toast('ทดสอบการเชื่อมต่อ ' + id + ' สำเร็จ'); return;
    case 'save': if (st.pendingRate != null && st.pendingRate !== CFG.p1) { log(['กฤษณ์ (Admin)', 'p-sent'], 'แก้ไขกติกาการจ่าย', 'config', `${CFG.p1}/${CFG.p2} → ${st.pendingRate}/${100 - st.pendingRate}`); CFG.p1 = st.pendingRate; CFG.p2 = 100 - st.pendingRate; toast(`บันทึกแล้ว · กติกาใหม่ ${CFG.p1}/${CFG.p2}`); } else toast('บันทึกแล้ว'); break;
    case 'sf': st.stmtTab = id; break;
    case 'rep': st.rep = id; break;
    case 'csv-rep': case 'csv-audit': {
      const rows = a === 'csv-audit' ? [['เวลา', 'ผู้ทำ', 'Action', 'อ้างอิง', 'รายละเอียด']].concat(audit.map(x => [x[0], x[1][0], x[2], x[3], x[4]]))
        : [['ช่าง', 'Booking', 'งาน', 'ค่างาน', `งวดแรก ${CFG.p1}%`, `hold ${CFG.p2}%`, 'สถานะงวดแรก', 'สถานะ hold']].concat(jobs.map(j => [T(j.tech).name, j.id, j.job, j.total, ...split(j.total), S1[j.s1][0], S2[j.s2][0]]));
      const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
      const u = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); const l = document.createElement('a'); l.href = u; l.download = a === 'csv-audit' ? 'bmt-audit.csv' : 'bmt-report.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); return; }
    default: return;
  }
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
