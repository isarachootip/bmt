[phases.setup]
nixPkgs = ["...", "openssl", "curl", "wget"]
nixLibs = ["...", "stdenv.cc.cc.lib", "zlib", "openssl"]

[variables]
NODE_OPTIONS = "--experimental-require-module"

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "USE_EXTERNAL_PG=false DATABASE_URL=postgresql://placeholder:placeholder@127.0.0.1:5432/bmt_db?schema=public npx prisma generate --schema=prisma/schema",
  "USE_EXTERNAL_PG=false DATABASE_URL=postgresql://placeholder:placeholder@127.0.0.1:5432/bmt_db?schema=public npx next build"
]

[start]
cmd = "npm run start"
